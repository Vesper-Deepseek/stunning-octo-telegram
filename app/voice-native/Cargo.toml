[package]
name = "loose_ends_voice_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
loose-ends-core = { path = "../../core", default-features = false, features = ["voice"] }
jni-sys = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
