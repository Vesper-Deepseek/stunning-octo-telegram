[package]
name = "loose_ends_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
loose-ends-core = { path = "../../core", default-features = false }
chrono = "0.4"
serde_json = "1"
flutter_rust_bridge = "2.13.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
jni-sys = { version = "0.4", optional = true }

[features]
jni = ["jni-sys"]
neural = ["loose-ends-core/neural"]
frb = ["flutter_rust_bridge"]
frb-neural = ["frb", "loose-ends-core/neural"]
voice = ["loose-ends-core/voice"]
ocr = ["loose-ends-core/ocr"]
multimodal = ["voice", "ocr"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
