org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
# Enable Gradle configuration cache for faster builds
org.gradle.configuration-cache=false
# Enable parallel project builds
org.gradle.parallel=true
# Enable build cache
org.gradle.caching=true
# Disable Android test variant to avoid configuration cache issues
android.experimental.disableTestVariant=true
