name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Extract OpenCV native libraries for all Android ABIs
        working-directory: app
        run: |
          flutter pub get
          chmod +x android/gradlew
          ./android/gradlew -p android :app:extractOpenCvNativeLibs

          for abi in arm64-v8a armeabi-v7a x86_64; do
            LIB="android/app/src/main/jniLibs/${abi}/libopencv_java4.so"
            test -s "$LIB"
            echo "OpenCV native library ready for $abi: $LIB"
          done

      - name: Install Rust Android targets
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build native Rust libraries for all Android ABIs
        working-directory: app
        env:
          NDK_VERSION: 28.2.13676358
          ANDROID_API: 24
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export AR_armv7_linux_androideabi="${TOOLCHAIN}/llvm-ar"
          export AR_x86_64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CC_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CC_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"
          export CXX_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang++"
          export CXX_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang++"
          export CARGO_CFG_TARGET_FEATURE=""

          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=${target}${ANDROID_API}"
            cargo generate-lockfile --manifest-path native/Cargo.toml
            cargo build --manifest-path native/Cargo.toml --release --target "${target}" --features jni,neural
            cargo generate-lockfile --manifest-path voice-native/Cargo.toml
            cargo build --manifest-path voice-native/Cargo.toml --release --target "${target}"
          done

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp native/target/aarch64-linux-android/release/libloose_ends_native.so android/app/src/main/jniLibs/arm64-v8a/libloose_ends_native.so
          cp native/target/armv7-linux-androideabi/release/libloose_ends_native.so android/app/src/main/jniLibs/armeabi-v7a/libloose_ends_native.so
          cp native/target/x86_64-linux-android/release/libloose_ends_native.so android/app/src/main/jniLibs/x86_64/libloose_ends_native.so
          cp voice-native/target/aarch64-linux-android/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/arm64-v8a/libloose_ends_voice.so
          cp voice-native/target/armv7-linux-androideabi/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/armeabi-v7a/libloose_ends_voice.so
          cp voice-native/target/x86_64-linux-android/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/x86_64/libloose_ends_voice.so

      - name: Build universal release APK
        working-directory: app
        run: flutter build apk --release

      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([0-9][^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          TAG="v${VERSION}"
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          for asset in             "lib/arm64-v8a/libloose_ends_native.so"             "lib/armeabi-v7a/libloose_ends_native.so"             "lib/x86_64/libloose_ends_native.so"             "lib/arm64-v8a/libloose_ends_voice.so"             "lib/armeabi-v7a/libloose_ends_voice.so"             "lib/x86_64/libloose_ends_voice.so"             "lib/arm64-v8a/libopencv_java4.so"             "lib/armeabi-v7a/libopencv_java4.so"             "lib/x86_64/libopencv_java4.so"
          do
            unzip -l "$APK" | grep -F "$asset"
          done

          sha256sum "$APK" | tee "${APK}.sha256"

          RELEASE_NOTES="Universal Android APK for Loose Ends ${TAG}.

          Contents:
          - Universal Flutter Android APK.
          - arm64-v8a, armeabi-v7a, and x86_64 native libraries.
          - Main Rust commitment/native bridge.
          - Isolated Whisper voice native bridge.
          - Local OCR/inference runtime support packaged with the application.

          The APK is published with a SHA-256 checksum. This release job also downloads the public release asset again and verifies its checksum and file size."

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "${APK}.sha256"               --repo "${{ github.repository }}"               --clobber
            gh release edit "$TAG"               --repo "${{ github.repository }}"               --target "${{ github.sha }}"               --title "Loose Ends ${TAG}"               --notes "${RELEASE_NOTES}"
          else
            gh release create "$TAG" "$APK" "${APK}.sha256"               --repo "${{ github.repository }}"               --target "${{ github.sha }}"               --title "Loose Ends ${TAG}"               --notes "${RELEASE_NOTES}"
          fi

          echo "Verifying the public GitHub Release asset can be downloaded"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/app-release.apk"
          rm -f /tmp/loose-ends-release.apk
          curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 "$DOWNLOAD_URL" -o /tmp/loose-ends-release.apk
          test -s /tmp/loose-ends-release.apk
          EXPECTED_SHA="$(awk '{print $1}' "${APK}.sha256")"
          DOWNLOADED_SHA="$(sha256sum /tmp/loose-ends-release.apk | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$DOWNLOADED_SHA"
          test "$(stat -c%s "$APK")" -eq "$(stat -c%s /tmp/loose-ends-release.apk)"
          echo "GitHub release APK download verified successfully."
