name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Install Rust Android targets
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build native Rust libraries for all Android ABIs
        working-directory: app
        env:
          NDK_VERSION: 28.2.13676358
          ANDROID_API: 24
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export AR_armv7_linux_androideabi="${TOOLCHAIN}/llvm-ar"
          export AR_x86_64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CC_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CC_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"
          export CXX_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang++"
          export CXX_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang++"
          # llama-cpp-sys-2 expects this Cargo build-script variable even when Cargo omits it for Android targets.
          export CARGO_CFG_TARGET_FEATURE=""

          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${NDK_DIR}/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=${target}${ANDROID_API}"
            cargo generate-lockfile --manifest-path native/Cargo.toml
            cargo build --manifest-path native/Cargo.toml --release --target "${target}" --features jni,neural
            cargo generate-lockfile --manifest-path voice-native/Cargo.toml
            cargo build --manifest-path voice-native/Cargo.toml --release --target "${target}"
          done

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp native/target/aarch64-linux-android/release/libloose_ends_native.so             android/app/src/main/jniLibs/arm64-v8a/libloose_ends_native.so
          cp native/target/armv7-linux-androideabi/release/libloose_ends_native.so             android/app/src/main/jniLibs/armeabi-v7a/libloose_ends_native.so
          cp native/target/x86_64-linux-android/release/libloose_ends_native.so             android/app/src/main/jniLibs/x86_64/libloose_ends_native.so
          cp voice-native/target/aarch64-linux-android/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/arm64-v8a/libloose_ends_voice.so
          cp voice-native/target/armv7-linux-androideabi/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/armeabi-v7a/libloose_ends_voice.so
          cp voice-native/target/x86_64-linux-android/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/x86_64/libloose_ends_voice.so

      - name: Build universal release APK
        working-directory: app
        run: flutter build apk --release

      - name: Create GitHub release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: \([0-9][^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          TAG="v${VERSION}"
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libloose_ends_native.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libloose_ends_native.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libloose_ends_native.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libloose_ends_voice.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libloose_ends_voice.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libloose_ends_voice.so"
          test -s "$APK"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --clobber
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Loose Ends ${TAG}" \
              --notes "Universal Android release built from ${{ github.event.workflow_run.head_sha }}. CI passed; emulator validation was intentionally disabled."
          else
            gh release create "$TAG" "$APK" \
              --repo "${{ github.repository }}" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "Loose Ends ${TAG}" \
              --notes "Universal Android release built from ${{ github.event.workflow_run.head_sha }}. CI passed; emulator validation was intentionally disabled."
          fi
