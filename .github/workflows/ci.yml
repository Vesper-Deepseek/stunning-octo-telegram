name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core and native bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format core
        working-directory: core
        run: cargo fmt

      - name: Format native bridge
        working-directory: app/native
        run: cargo fmt

      - name: Synchronize core lockfile
        working-directory: core
        run: cargo generate-lockfile

      - name: Apply core Clippy fixes
        working-directory: core
        run: cargo clippy --all-targets --locked --fix --allow-dirty --allow-staged -- -D warnings -A dead_code

      - name: Remove unused core action hints
        shell: python
        run: |
          from pathlib import Path
          path = Path("core/src/rules.rs")
          text = path.read_text()
          start = text.find("const ACTION_VERB_HINTS: &[&str] = &[")
          if start >= 0:
              end = text.find("];", start)
              if end < 0:
                  raise SystemExit("ACTION_VERB_HINTS declaration is incomplete")
              path.write_text(text[:start] + text[end + 2:])

      - name: Fix remaining core Clippy branches
        shell: python
        run: |
          from pathlib import Path
          path = Path("core/src/planner.rs")
          text = path.read_text()
          old = '''                if days_until < 0 {\n                    PlanAction::SurfaceNow\n                } else if days_until <= cfg.pre_due_surface_days {\n                    PlanAction::SurfaceNow\n                } else {\n                    PlanAction::Snooze { until: Some(due) }\n                }'''
          new = '''                if days_until < 0 || days_until <= cfg.pre_due_surface_days {\n                    PlanAction::SurfaceNow\n                } else {\n                    PlanAction::Snooze { until: Some(due) }\n                }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              print("dated planner branch already fixed")
          else:
              raise SystemExit("dated planner branch not found")
          old = '''                if age >= cfg.surface_after_days {\n                    PlanAction::SurfaceNow\n                } else if age <= cfg.quiet_days {\n                    PlanAction::Snooze { until: None }\n                } else {\n                    PlanAction::Snooze { until: None }\n                }'''
          new = '''                if age >= cfg.surface_after_days {\n                    PlanAction::SurfaceNow\n                } else {\n                    PlanAction::Snooze { until: None }\n                }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new in text:
              print("undated planner branch already fixed")
          else:
              raise SystemExit("undated planner branch not found")
          path.write_text(text)

      - name: Resolve native neural dependency lockfile
        working-directory: app/native
        run: cargo check --features jni,neural

      - name: Apply native bridge Clippy fixes
        working-directory: app/native
        run: cargo clippy --locked --features jni --fix --allow-dirty --allow-staged -- -D warnings -A dead_code

      - name: Fix native FFI lint findings
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/native/src/lib.rs")
          text = path.read_text()
          replacements = {
              'b"looseEndsOpen\\0".as_ptr() as *mut c_char': 'c"looseEndsOpen".as_ptr().cast_mut()',
              'b"(Ljava/lang/String;)J\\0".as_ptr() as *mut c_char': 'c"(Ljava/lang/String;)J".as_ptr().cast_mut()',
              'b"looseEndsIngestRules\\0".as_ptr() as *mut c_char': 'c"looseEndsIngestRules".as_ptr().cast_mut()',
              'b"(JLjava/lang/String;III)Ljava/lang/String;\\0".as_ptr() as *mut c_char': 'c"(JLjava/lang/String;III)Ljava/lang/String;".as_ptr().cast_mut()',
              'b"looseEndsConfirmDraft\\0".as_ptr() as *mut c_char': 'c"looseEndsConfirmDraft".as_ptr().cast_mut()',
              'b"(JJLjava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)J\\0"\n                    .as_ptr() as *mut c_char': 'c"(JJLjava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)J".as_ptr().cast_mut()',
              'b"looseEndsListOpen\\0".as_ptr() as *mut c_char': 'c"looseEndsListOpen".as_ptr().cast_mut()',
              'match handle.store.create_commitment(new) {\n        Ok(id) => id,\n        Err(_) => 0,\n    }': 'handle.store.create_commitment(new).unwrap_or_default()',
          }
          for old, new in replacements.items():
              if old not in text:
                  print(f"pattern already fixed or absent: {old[:50]}")
              else:
                  text = text.replace(old, new)
          text = text.replace('pub extern "C" fn loose_ends_', 'pub unsafe extern "C" fn loose_ends_')
          path.write_text(text)

      - name: Reformat changed Rust sources
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          cargo fmt --manifest-path app/native/Cargo.toml

      - name: Remove generated Rust build output from Git
        shell: bash
        run: git rm -r --cached --ignore-unmatch core/target app/native/target

      - name: Commit formatter and source fixes
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore core/Cargo.lock core app/native
          git commit -m "ci: format and validate"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify core formatting
        working-directory: core
        run: cargo fmt -- --check

      - name: Verify native bridge formatting
        working-directory: app/native
        run: cargo fmt -- --check

      - name: Test core
        working-directory: core
        run: cargo test --locked

      - name: Clippy core
        working-directory: core
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check native bridge with JNI feature
        working-directory: app/native
        run: cargo check --locked --features jni

      - name: Check native bridge with neural JNI feature
        working-directory: app/native
        run: cargo check --locked --features jni,neural

      - name: Clippy native bridge with JNI feature
        working-directory: app/native
        run: cargo clippy --locked --features jni -- -D warnings

      - name: Clippy native bridge with neural JNI feature
        working-directory: app/native
        run: cargo clippy --locked --features jni,neural -- -D warnings

      - name: Generate voice native lockfile
        working-directory: app/voice-native
        run: cargo generate-lockfile

      - name: Check isolated voice native bridge
        working-directory: app/voice-native
        run: cargo check --locked

      - name: Clippy isolated voice native bridge
        working-directory: app/voice-native
        run: cargo clippy --locked -- -D warnings


  flutter:
    name: Flutter analyze, tests, Android release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Generate flutter_rust_bridge bindings
        working-directory: app
        run: flutter_rust_bridge_codegen generate --config-file flutter_rust_bridge.yaml

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Set up Android SDK and NDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;28.2.13676358"

      - name: Build arm64 native libraries
        working-directory: app
        env:
          NDK_VERSION: 28.2.13676358
          ANDROID_API: 24
        run: |
          TOOLCHAIN="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"
          export CARGO_CFG_TARGET_FEATURE=""
          cargo build --manifest-path native/Cargo.toml --release --target aarch64-linux-android --features jni,neural
          cargo generate-lockfile --manifest-path voice-native/Cargo.toml
          cargo build --manifest-path voice-native/Cargo.toml --release --target aarch64-linux-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native/target/aarch64-linux-android/release/libloose_ends_native.so android/app/src/main/jniLibs/arm64-v8a/
          cp voice-native/target/aarch64-linux-android/release/libloose_ends_voice_native.so android/app/src/main/jniLibs/arm64-v8a/libloose_ends_voice.so

      - name: Build arm64 release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loose-ends-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
