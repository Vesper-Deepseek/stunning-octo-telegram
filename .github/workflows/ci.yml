name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust core and native bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format core
        working-directory: core
        run: cargo fmt --check

      - name: Test core
        working-directory: core
        run: cargo test --locked

      - name: Clippy core
        working-directory: core
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Format native bridge
        working-directory: app/native
        run: cargo fmt --check

      - name: Check native bridge with JNI feature
        working-directory: app/native
        run: cargo check --locked --features jni

      - name: Clippy native bridge with JNI feature
        working-directory: app/native
        run: cargo clippy --locked --features jni -- -D warnings

  flutter:
    name: Flutter analyze, tests, Android release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Build arm64 release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loose-ends-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
