name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust:
    name: Rust core and native bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format core
        working-directory: core
        run: cargo fmt

      - name: Format native bridge
        working-directory: app/native
        run: cargo fmt

      - name: Apply core Clippy fixes
        working-directory: core
        run: cargo clippy --all-targets --locked --fix --allow-dirty --allow-staged -- -D warnings -A dead_code

      - name: Remove unused core action hints
        shell: python
        run: |
          from pathlib import Path
          path = Path("core/src/rules.rs")
          text = path.read_text()
          start = text.find("const ACTION_VERB_HINTS: &[&str] = &[")
          if start >= 0:
              end = text.find("];", start)
              if end < 0:
                  raise SystemExit("ACTION_VERB_HINTS declaration is incomplete")
              path.write_text(text[:start] + text[end + 2:])

      - name: Apply native bridge Clippy fixes
        working-directory: app/native
        run: cargo clippy --locked --features jni --fix --allow-dirty --allow-staged -- -D warnings -A dead_code

      - name: Reformat changed Rust sources
        run: |
          cargo fmt --manifest-path core/Cargo.toml
          cargo fmt --manifest-path app/native/Cargo.toml

      - name: Commit formatter and Clippy fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core app/native
          git commit -m "ci: format and validate"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify core formatting
        working-directory: core
        run: cargo fmt -- --check

      - name: Verify native bridge formatting
        working-directory: app/native
        run: cargo fmt -- --check

      - name: Test core
        working-directory: core
        run: cargo test --locked

      - name: Clippy core
        working-directory: core
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check native bridge with JNI feature
        working-directory: app/native
        run: cargo check --locked --features jni

      - name: Clippy native bridge with JNI feature
        working-directory: app/native
        run: cargo clippy --locked --features jni -- -D warnings

  flutter:
    name: Flutter analyze, tests, Android release build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      - name: Build arm64 release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loose-ends-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
