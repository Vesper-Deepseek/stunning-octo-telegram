name: Android Emulator Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Install and launch universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build current universal APK
        working-directory: app
        env:
          NDK_VERSION: 28.2.13676358
          ANDROID_API: 24
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          TOOLCHAIN="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo build --manifest-path native/Cargo.toml --locked --release --target "${target}" --features jni
          done
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp native/target/aarch64-linux-android/release/libloose_ends_native.so             android/app/src/main/jniLibs/arm64-v8a/libloose_ends_native.so
          cp native/target/armv7-linux-androideabi/release/libloose_ends_native.so             android/app/src/main/jniLibs/armeabi-v7a/libloose_ends_native.so
          cp native/target/x86_64-linux-android/release/libloose_ends_native.so             android/app/src/main/jniLibs/x86_64/libloose_ends_native.so
          flutter pub get
          flutter build apk --release
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/app-release.apk
          test -s ../artifacts/app-release.apk
          sha256sum ../artifacts/app-release.apk
          unzip -l ../artifacts/app-release.apk | grep -F "lib/x86_64/libloose_ends_native.so"

      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eux
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r artifacts/app-release.apk
            adb shell am force-stop com.looseends.loose_ends
            adb logcat -c
            START_STATUS=0
            adb shell am start -W -n com.looseends.loose_ends/.MainActivity > artifacts/start.txt 2>&1 || START_STATUS=$?
            sleep 12
            APP_PID="$(adb shell pidof com.looseends.loose_ends || true)"
            echo "APP_PID=$APP_PID"
            adb shell dumpsys window windows > artifacts/windows.txt 2>&1 || true
            adb shell dumpsys activity activities > artifacts/activities.txt 2>&1 || true
            adb exec-out screencap -p > artifacts/startup.png 2> artifacts/screenshot-error.txt || true
            adb shell uiautomator dump /sdcard/window.xml > artifacts/uiautomator.txt 2>&1 || true
            adb pull /sdcard/window.xml artifacts/window.xml > artifacts/uiautomator-pull.txt 2>&1 || true
            adb logcat -d -v threadtime > artifacts/logcat.txt
            CRASH=0
            if grep -Eq 'FATAL EXCEPTION|Process: com\.looseends\.loose_ends|UnsatisfiedLinkError|NoClassDefFoundError|SIGSEGV|SIGABRT' artifacts/logcat.txt; then
              CRASH=1
            fi
            if [ "$START_STATUS" -ne 0 ] || [ -z "$APP_PID" ] || [ "$CRASH" -ne 0 ]; then
              echo "Android smoke test failed"
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
