name: Android Emulator Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-main
  cancel-in-progress: true


jobs:
  emulator:
    name: Install, launch, and exercise Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source commit under test
        uses: actions/checkout@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build current universal APK
        working-directory: app
        env:
          NDK_VERSION: 28.2.13676358
          ANDROID_API: 24
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}"
          TOOLCHAIN="${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export PATH="${TOOLCHAIN}:${PATH}"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export AR_armv7_linux_androideabi="${TOOLCHAIN}/llvm-ar"
          export AR_x86_64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang"
          export CC_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang++"
          export CXX_armv7_linux_androideabi="${TOOLCHAIN}/armv7a-linux-androideabi${ANDROID_API}-clang++"
          export CXX_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang++"
          # llama-cpp-sys-2 expects this Cargo build-script variable even when Cargo omits it for Android targets.
          export CARGO_CFG_TARGET_FEATURE=""
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${ANDROID_HOME}/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=x86_64-linux-android${ANDROID_API}"
          export CC_x86_64_linux_android="${TOOLCHAIN}/x86_64-linux-android${ANDROID_API}-clang"
          # The emulator runs x86_64, so the smoke-test APK only needs that ABI.
          cargo generate-lockfile --manifest-path native/Cargo.toml
          cargo build --manifest-path native/Cargo.toml --release --target x86_64-linux-android --features jni,neural
          cargo generate-lockfile --manifest-path voice-native/Cargo.toml
          cargo build --manifest-path voice-native/Cargo.toml --release --target x86_64-linux-android
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp native/target/x86_64-linux-android/release/libloose_ends_native.so \
            android/app/src/main/jniLibs/x86_64/libloose_ends_native.so
          cp voice-native/target/x86_64-linux-android/release/libloose_ends_voice_native.so \
            android/app/src/main/jniLibs/x86_64/libloose_ends_voice.so
          flutter pub get
          flutter build apk --release --target-platform android-x64
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/app-release.apk
          test -s ../artifacts/app-release.apk
          sha256sum ../artifacts/app-release.apk
          unzip -l ../artifacts/app-release.apk | grep -F "lib/x86_64/libloose_ends_native.so"
          unzip -l ../artifacts/app-release.apk | grep -F "lib/x86_64/libloose_ends_voice.so"

      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r artifacts/app-release.apk
            adb shell pm grant com.looseends.loose_ends android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.looseends.loose_ends
            adb logcat -c
            adb shell am start -W -n com.looseends.loose_ends/.MainActivity > artifacts/release_start.txt 2>&1
            sleep 8
            adb shell pidof com.looseends.loose_ends > artifacts/release_app_pid.txt 2>&1 || true
            adb shell dumpsys window windows > artifacts/release_windows.txt 2>&1 || true
            adb shell dumpsys activity activities > artifacts/release_activities.txt 2>&1 || true
            adb exec-out screencap -p > artifacts/release_startup.png 2> artifacts/release_screenshot-error.txt || true
            adb shell uiautomator dump /sdcard/window.xml > artifacts/release_uiautomator.txt 2>&1 || true
            adb pull /sdcard/window.xml artifacts/release_window.xml > artifacts/release_uiautomator-pull.txt 2>&1 || true
            adb logcat -d -v threadtime > artifacts/release_launch_logcat.txt
            test -s artifacts/release_app_pid.txt && grep -Eq '^[0-9]+'
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.looseends\.loose_ends|UnsatisfiedLinkError|NoClassDefFoundError|SIGSEGV|SIGABRT' artifacts/release_launch_logcat.txt

            # Exercise the same application package with Flutter integration_test.
            # Disable device networking so successful commitment capture is an offline test.
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            flutter test integration_test/mvp_smoke_test.dart -d "$ANDROID_SERIAL" --timeout 5m

            # Reinstall and launch the release artifact again after integration_test.
            adb shell svc wifi enable || true
            adb install -r artifacts/app-release.apk
            adb shell pm grant com.looseends.loose_ends android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.looseends.loose_ends
            adb logcat -c
            adb shell am start -W -n com.looseends.loose_ends/.MainActivity > artifacts/final_release_start.txt 2>&1
            sleep 8
            adb shell pidof com.looseends.loose_ends > artifacts/final_release_pid.txt 2>&1
            adb exec-out screencap -p > artifacts/final_release.png 2> artifacts/final_screenshot-error.txt || true
            adb logcat -d -v threadtime > artifacts/final_release_logcat.txt
            test -s artifacts/final_release_pid.txt && grep -Eq '^[0-9]+'
            ! grep -Eq 'FATAL EXCEPTION|Process: com\.looseends\.loose_ends|UnsatisfiedLinkError|NoClassDefFoundError|SIGSEGV|SIGABRT' artifacts/final_release_logcat.txt

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
