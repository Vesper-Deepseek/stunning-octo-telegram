[package]
name = "loose-ends-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
llama-cpp-2 = { version = "0.1.154", features = ["common"], optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
neural = ["llama-cpp-2", "encoding_rs"]

[[bin]]
name = "eval_rust"
path = "src/bin/eval_rust.rs"
required-features = ["neural"]

[[bin]]
name = "test_grammar_parse"
path = "test_grammar_parse.rs"
required-features = ["neural"]
