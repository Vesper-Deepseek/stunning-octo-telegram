[package]
name = "loose-ends-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
cmake = "=0.1.54"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
llama-cpp-2 = { version = "0.1.154", features = ["common"], optional = true }
encoding_rs = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
whisper_cpp = { version = "0.2.1", default-features = false, features = ["compat"], optional = true }
hound = { version = "3.5", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"], optional = true }
rten = { version = "0.26.0", default-features = false, features = ["rten_format"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
neural = ["llama-cpp-2", "encoding_rs"]
voice = ["whisper_cpp", "hound", "tokio"]
ocr = ["ocrs", "rten", "image"]
multimodal = ["voice", "ocr"]

[[bin]]
name = "eval_rust"
path = "src/bin/eval_rust.rs"
required-features = ["neural"]

[[bin]]
name = "test_grammar_parse"
path = "test_grammar_parse.rs"
required-features = ["neural"]
